<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mini Paint</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #202124;
    color: white;
    height: 100vh;
    overflow: hidden;
}

/* =========================
   APP
========================= */

.app {
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* =========================
   BARRA SUPERIOR
========================= */

.topbar {
    height: 58px;
    background: #2b2d31;
    border-bottom: 1px solid #444;
    display: flex;
    align-items: center;
    padding: 0 15px;
    gap: 12px;
}

.logo {
    font-size: 20px;
    font-weight: bold;
    margin-right: 10px;
}

.top-button {
    border: none;
    background: #3a3d43;
    color: white;
    padding: 9px 13px;
    border-radius: 7px;
    cursor: pointer;
    transition: .15s;
}

.top-button:hover {
    background: #4b4f56;
}

.top-button:active {
    transform: scale(.95);
}

.spacer {
    flex: 1;
}

/* =========================
   CUERPO
========================= */

.main {
    flex: 1;
    display: flex;
    min-height: 0;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    width: 245px;
    background: #292b2f;
    border-right: 1px solid #444;
    padding: 14px;
    overflow-y: auto;
}

.section {
    margin-bottom: 20px;
}

.section-title {
    font-size: 12px;
    text-transform: uppercase;
    color: #aaa;
    margin-bottom: 9px;
    font-weight: bold;
}

/* herramientas */

.tools {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
}

.tool {
    height: 48px;
    border: none;
    background: #36393f;
    color: white;
    border-radius: 7px;
    cursor: pointer;
    font-size: 12px;
}

.tool:hover {
    background: #44474e;
}

.tool.active {
    background: #5865f2;
}

/* =========================
   COLORES
========================= */

.color-row {
    display: flex;
    align-items: center;
    gap: 10px;
}

#colorPicker {
    width: 55px;
    height: 40px;
    border: none;
    cursor: pointer;
    background: none;
}

.color-info {
    font-size: 13px;
    color: #ccc;
}

.palette {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 5px;
    margin-top: 10px;
}

.palette-color {
    width: 22px;
    height: 22px;
    border-radius: 5px;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,.2);
}

/* =========================
   CONTROLES
========================= */

input[type="range"] {
    width: 100%;
}

.range-value {
    text-align: center;
    font-size: 13px;
    color: #ccc;
    margin-top: 5px;
}

select {
    width: 100%;
    background: #36393f;
    color: white;
    border: 1px solid #555;
    padding: 8px;
    border-radius: 6px;
}

/* =========================
   LIENZO
========================= */

.workspace {
    flex: 1;
    position: relative;
    overflow: hidden;
    background:
        linear-gradient(45deg, #303238 25%, transparent 25%),
        linear-gradient(-45deg, #303238 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #303238 75%),
        linear-gradient(-45deg, transparent 75%, #303238 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0;
}

/* contenedor centrado */

.canvas-container {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 10px 35px rgba(0,0,0,.5);
}

/* canvas */

#canvas {
    display: block;
    background: white;
    cursor: crosshair;
    touch-action: none;
}

/* =========================
   BARRA INFERIOR
========================= */

.statusbar {
    height: 34px;
    background: #292b2f;
    border-top: 1px solid #444;
    display: flex;
    align-items: center;
    padding: 0 15px;
    font-size: 12px;
    color: #aaa;
    gap: 25px;
}

.status-right {
    margin-left: auto;
}

/* =========================
   MODAL TEXTO
========================= */

.text-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
}

.text-box {
    background: #2b2d31;
    width: 350px;
    padding: 22px;
    border-radius: 12px;
    box-shadow: 0 15px 50px rgba(0,0,0,.5);
}

.text-box h2 {
    margin-bottom: 15px;
}

.text-box input {
    width: 100%;
    padding: 11px;
    border-radius: 7px;
    border: 1px solid #555;
    background: #202124;
    color: white;
    margin-bottom: 12px;
}

.text-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
}

.text-buttons button {
    border: none;
    padding: 9px 14px;
    border-radius: 7px;
    cursor: pointer;
}

.cancel {
    background: #444;
    color: white;
}

.confirm {
    background: #5865f2;
    color: white;
}

/* =========================
   SCROLLBAR
========================= */

::-webkit-scrollbar {
    width: 8px;
}

::-webkit-scrollbar-track {
    background: #222;
}

::-webkit-scrollbar-thumb {
    background: #555;
    border-radius: 10px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width: 750px) {

    .sidebar {
        width: 180px;
    }

    .tools {
        grid-template-columns: repeat(2, 1fr);
    }

    .logo {
        display: none;
    }

}

</style>
</head>

<body>

<div class="app">

    <!-- =========================
         BARRA SUPERIOR
    ========================== -->

    <div class="topbar">

        <div class="logo">
            🎨 Mini Paint
        </div>

        <button class="top-button" onclick="newCanvas()">
            📄 Nuevo
        </button>

        <button class="top-button" onclick="document.getElementById('fileInput').click()">
            📂 Abrir
        </button>

        <button class="top-button" onclick="saveImage()">
            💾 Guardar
        </button>

        <div class="spacer"></div>

        <button class="top-button" onclick="undo()">
            ↩️
        </button>

        <button class="top-button" onclick="redo()">
            ↪️
        </button>

        <button class="top-button" onclick="clearCanvas()">
            🗑️
        </button>

        <input
            type="file"
            id="fileInput"
            accept="image/*"
            style="display:none"
        >

    </div>


    <!-- =========================
         CUERPO
    ========================== -->

    <div class="main">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <!-- HERRAMIENTAS -->

            <div class="section">

                <div class="section-title">
                    Herramientas
                </div>

                <div class="tools">

                    <button class="tool active" data-tool="pencil">
                        ✏️<br>Lápiz
                    </button>

                    <button class="tool" data-tool="brush">
                        🖌️<br>Pincel
                    </button>

                    <button class="tool" data-tool="eraser">
                        🧹<br>Goma
                    </button>

                    <button class="tool" data-tool="line">
                        ╱<br>Línea
                    </button>

                    <button class="tool" data-tool="rectangle">
                        ▭<br>Rect.
                    </button>

                    <button class="tool" data-tool="circle">
                        ○<br>Círculo
                    </button>

                    <button class="tool" data-tool="fill">
                        🪣<br>Relleno
                    </button>

                    <button class="tool" data-tool="text">
                        🔤<br>Texto
                    </button>

                    <button class="tool" data-tool="picker">
                        💧<br>Color
                    </button>

                </div>

            </div>


            <!-- COLOR -->

            <div class="section">

                <div class="section-title">
                    Color
                </div>

                <div class="color-row">

                    <input
                        type="color"
                        id="colorPicker"
                        value="#000000"
                    >

                    <div class="color-info">
                        Color actual
                        <br>
                        <span id="colorHex">#000000</span>
                    </div>

                </div>

                <div class="palette" id="palette"></div>

            </div>


            <!-- TAMAÑO -->

            <div class="section">

                <div class="section-title">
                    Tamaño
                </div>

                <input
                    type="range"
                    id="size"
                    min="1"
                    max="80"
                    value="5"
                >

                <div class="range-value">
                    <span id="sizeValue">5</span> px
                </div>

            </div>


            <!-- OPACIDAD -->

            <div class="section">

                <div class="section-title">
                    Opacidad
                </div>

                <input
                    type="range"
                    id="opacity"
                    min="1"
                    max="100"
                    value="100"
                >

                <div class="range-value">
                    <span id="opacityValue">100</span>%
                </div>

            </div>


            <!-- TEXTO -->

            <div class="section">

                <div class="section-title">
                    Texto
                </div>

                <select id="font">

                    <option value="Arial">
                        Arial
                    </option>

                    <option value="Verdana">
                        Verdana
                    </option>

                    <option value="Georgia">
                        Georgia
                    </option>

                    <option value="Times New Roman">
                        Times New Roman
                    </option>

                    <option value="Courier New">
                        Courier New
                    </option>

                </select>

            </div>


            <!-- ZOOM -->

            <div class="section">

                <div class="section-title">
                    Zoom
                </div>

                <input
                    type="range"
                    id="zoom"
                    min="50"
                    max="200"
                    value="100"
                >

                <div class="range-value">
                    <span id="zoomValue">100</span>%
                </div>

            </div>

        </aside>


        <!-- WORKSPACE -->

        <main class="workspace" id="workspace">

            <div class="canvas-container" id="canvasContainer">

                <canvas
                    id="canvas"
                    width="1000"
                    height="650"
                ></canvas>

            </div>

        </main>

    </div>


    <!-- STATUS BAR -->

    <div class="statusbar">

        <span>
            Posición:
            <span id="position">
                0, 0
            </span>
        </span>

        <span>
            Lienzo: 1000 × 650
        </span>

        <div class="status-right">

            Zoom:
            <span id="statusZoom">
                100
            </span>%

        </div>

    </div>

</div>


<!-- =========================
     MODAL TEXTO
========================= -->

<div class="text-modal" id="textModal">

    <div class="text-box">

        <h2>Agregar texto</h2>

        <input
            type="text"
            id="textInput"
            placeholder="Escribí tu texto..."
        >

        <div class="text-buttons">

            <button
                class="cancel"
                onclick="closeTextModal()"
            >
                Cancelar
            </button>

            <button
                class="confirm"
                onclick="confirmText()"
            >
                Agregar
            </button>

        </div>

    </div>

</div>


<script>

/* ==========================================
   CANVAS
========================================== */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const container = document.getElementById("canvasContainer");
const workspace = document.getElementById("workspace");

let tool = "pencil";

let drawing = false;

let startX = 0;
let startY = 0;

let lastX = 0;
let lastY = 0;

let currentColor = "#000000";

let brushSize = 5;

let opacity = 1;

let zoom = 1;


/* ==========================================
   HISTORIAL
========================================== */

let history = [];
let historyIndex = -1;

function saveState() {

    if (historyIndex < history.length - 1) {
        history = history.slice(0, historyIndex + 1);
    }

    history.push(
        canvas.toDataURL()
    );

    historyIndex++;

    if (history.length > 40) {
        history.shift();
        historyIndex--;
    }
}


function restoreState(index) {

    if (index < 0 || index >= history.length)
        return;

    const img = new Image();

    img.onload = function() {

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.drawImage(img, 0, 0);

    };

    img.src = history[index];

}


/* ==========================================
   DESHACER
========================================== */

function undo() {

    if (historyIndex > 0) {

        historyIndex--;

        restoreState(historyIndex);

    }

}


/* ==========================================
   REHACER
========================================== */

function redo() {

    if (historyIndex < history.length - 1) {

        historyIndex++;

        restoreState(historyIndex);

    }

}


/* ==========================================
   INICIALIZAR
========================================== */

function initializeCanvas() {

    ctx.fillStyle = "white";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    saveState();

}

initializeCanvas();


/* ==========================================
   HERRAMIENTAS
========================================== */

document.querySelectorAll(".tool").forEach(button => {

    button.addEventListener("click", () => {

        document
            .querySelectorAll(".tool")
            .forEach(b => b.classList.remove("active"));

        button.classList.add("active");

        tool = button.dataset.tool;

        updateCursor();

    });

});


/* ==========================================
   CURSOR
========================================== */

function updateCursor() {

    if (tool === "eraser") {

        canvas.style.cursor = "cell";

    } else if (tool === "text") {

        canvas.style.cursor = "text";

    } else {

        canvas.style.cursor = "crosshair";

    }

}


/* ==========================================
   COLOR
========================================== */

const colorPicker =
    document.getElementById("colorPicker");

colorPicker.addEventListener(
    "input",
    function() {

        currentColor = this.value;

        document.getElementById("colorHex")
            .textContent =
            currentColor.toUpperCase();

    }
);


/* ==========================================
   PALETA
========================================== */

const colors = [

    "#000000",
    "#ffffff",
    "#ff0000",
    "#ff6600",
    "#ffff00",
    "#00cc00",
    "#00ffff",
    "#0066ff",

    "#6600ff",
    "#ff00ff",
    "#8b4513",
    "#808080",
    "#c0c0c0",
    "#800000",
    "#008000",
    "#000080",

    "#ffa500",
    "#ffc0cb",
    "#800080",
    "#008080",
    "#f5deb3",
    "#ffd700",
    "#4b0082",
    "#dc143c"

];

const palette =
    document.getElementById("palette");

colors.forEach(color => {

    const element =
        document.createElement("div");

    element.className =
        "palette-color";

    element.style.background =
        color;

    element.addEventListener(
        "click",
        () => {

            currentColor = color;

            colorPicker.value = color;

            document.getElementById("colorHex")
                .textContent =
                color.toUpperCase();

        }
    );

    palette.appendChild(element);

});


/* ==========================================
   TAMAÑO
========================================== */

const size =
    document.getElementById("size");

size.addEventListener(
    "input",
    function() {

        brushSize =
            Number(this.value);

        document.getElementById("sizeValue")
            .textContent =
            brushSize;

    }
);


/* ==========================================
   OPACIDAD
========================================== */

const opacityInput =
    document.getElementById("opacity");

opacityInput.addEventListener(
    "input",
    function() {

        opacity =
            Number(this.value) / 100;

        document.getElementById("opacityValue")
            .textContent =
            this.value;

    }
);


/* ==========================================
   COORDENADAS
========================================== */

function getPosition(e) {

    const rect =
        canvas.getBoundingClientRect();

    return {

        x:
        (e.clientX - rect.left)
        * (canvas.width / rect.width),

        y:
        (e.clientY - rect.top)
        * (canvas.height / rect.height)

    };

}


/* ==========================================
   POINTER DOWN
========================================== */

canvas.addEventListener(
    "pointerdown",
    function(e) {

        const pos =
            getPosition(e);

        startX =
            pos.x;

        startY =
            pos.y;

        lastX =
            pos.x;

        lastY =
            pos.y;

        document.getElementById("position")
            .textContent =
            `${Math.round(pos.x)}, ${Math.round(pos.y)}`;

        if (tool === "fill") {

            floodFill(
                Math.floor(pos.x),
                Math.floor(pos.y)
            );

            saveState();

            return;

        }


        if (tool === "picker") {

            pickColor(
                Math.floor(pos.x),
                Math.floor(pos.y)
            );

            return;

        }


        if (tool === "text") {

            openTextModal();

            return;

        }


        drawing = true;

        canvas.setPointerCapture(e.pointerId);

        ctx.beginPath();

        ctx.moveTo(
            pos.x,
            pos.y
        );

    }
);


/* ==========================================
   POINTER MOVE
========================================== */

canvas.addEventListener(
    "pointermove",
    function(e) {

        const pos =
            getPosition(e);

        document.getElementById("position")
            .textContent =
            `${Math.round(pos.x)}, ${Math.round(pos.y)}`;

        if (!drawing)
            return;

        if (
            tool === "pencil" ||
            tool === "brush" ||
            tool === "eraser"
        ) {

            drawFreehand(
                pos.x,
                pos.y
            );

        }

    }
);


/* ==========================================
   POINTER UP
========================================== */

canvas.addEventListener(
    "pointerup",
    function(e) {

        if (!drawing)
            return;

        drawing = false;

        const pos =
            getPosition(e);

        if (
            tool === "line" ||
            tool === "rectangle" ||
            tool === "circle"
        ) {

            drawShape(
                pos.x,
                pos.y
            );

        }

        ctx.globalAlpha = 1;

        saveState();

    }
);


/* ==========================================
   DIBUJO LIBRE
========================================== */

function drawFreehand(x, y) {

    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.lineWidth =
        tool === "brush"
            ? brushSize * 2
            : brushSize;

    ctx.globalAlpha =
        opacity;

    if (tool === "eraser") {

        ctx.globalCompositeOperation =
            "destination-out";

    } else {

        ctx.globalCompositeOperation =
            "source-over";

        ctx.strokeStyle =
            currentColor;

    }

    ctx.lineTo(x, y);

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(x, y);

    ctx.globalCompositeOperation =
        "source-over";

}


/* ==========================================
   FORMAS
========================================== */

function drawShape(x, y) {

    ctx.save();

    ctx.globalAlpha =
        opacity;

    ctx.strokeStyle =
        currentColor;

    ctx.fillStyle =
        currentColor;

    ctx.lineWidth =
        brushSize;

    ctx.lineCap =
        "round";

    ctx.beginPath();


    if (tool === "line") {

        ctx.moveTo(
            startX,
            startY
        );

        ctx.lineTo(
            x,
            y
        );

        ctx.stroke();

    }


    if (tool === "rectangle") {

        ctx.strokeRect(
            startX,
            startY,
            x - startX,
            y - startY
        );

    }


    if (tool === "circle") {

        const dx =
            x - startX;

        const dy =
            y - startY;

        const radius =
            Math.sqrt(
                dx * dx +
                dy * dy
            );

        ctx.arc(
            startX,
            startY,
            radius,
            0,
            Math.PI * 2
        );

        ctx.stroke();

    }

    ctx.restore();

}


/* ==========================================
   RELLENO
========================================== */

function floodFill(startX, startY) {

    const imageData =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );

    const data =
        imageData.data;

    const startIndex =
        (startY * canvas.width + startX) * 4;

    const targetColor = [

        data[startIndex],
        data[startIndex + 1],
        data[startIndex + 2],
        data[startIndex + 3]

    ];

    const fillColor =
        hexToRgba(
            currentColor
        );

    if (
        targetColor[0] === fillColor[0] &&
        targetColor[1] === fillColor[1] &&
        targetColor[2] === fillColor[2]
    ) {

        return;

    }


    const stack = [
        [startX, startY]
    ];


    while (stack.length) {

        const [x, y] =
            stack.pop();

        if (
            x < 0 ||
            y < 0 ||
            x >= canvas.width ||
            y >= canvas.height
        )
            continue;


        const index =
            (y * canvas.width + x) * 4;


        if (
            data[index] !== targetColor[0] ||
            data[index + 1] !== targetColor[1] ||
            data[index + 2] !== targetColor[2] ||
            data[index + 3] !== targetColor[3]
        )
            continue;


        data[index] =
            fillColor[0];

        data[index + 1] =
            fillColor[1];

        data[index + 2] =
            fillColor[2];

        data[index + 3] =
            255;


        stack.push([x + 1, y]);
        stack.push([x - 1, y]);
        stack.push([x, y + 1]);
        stack.push([x, y - 1]);

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );

}


/* ==========================================
   HEX → RGB
========================================== */

function hexToRgba(hex) {

    hex =
        hex.replace("#", "");

    return [

        parseInt(
            hex.substring(0, 2),
            16
        ),

        parseInt(
            hex.substring(2, 4),
            16
        ),

        parseInt(
            hex.substring(4, 6),
            16
        ),

        255

    ];

}


/* ==========================================
   SELECTOR DE COLOR
========================================== */

function pickColor(x, y) {

    const pixel =
        ctx.getImageData(
            x,
            y,
            1,
            1
        ).data;

    const hex =
        "#" +
        [pixel[0], pixel[1], pixel[2]]
        .map(
            x =>
            x.toString(16)
            .padStart(2, "0")
        )
        .join("");

    currentColor =
        hex;

    colorPicker.value =
        hex;

    document.getElementById("colorHex")
        .textContent =
        hex.toUpperCase();

}


/* ==========================================
   TEXTO
========================================== */

let textX = 0;
let textY = 0;

function openTextModal() {

    textX =
        startX;

    textY =
        startY;

    document.getElementById("textModal")
        .style.display =
        "flex";

    document.getElementById("textInput")
        .value = "";

    document.getElementById("textInput")
        .focus();

}


function closeTextModal() {

    document.getElementById("textModal")
        .style.display =
        "none";

}


function confirmText() {

    const text =
        document.getElementById("textInput")
            .value;

    if (!text.trim()) {

        closeTextModal();

        return;

    }


    const font =
        document.getElementById("font")
            .value;


    ctx.save();

    ctx.globalAlpha =
        opacity;

    ctx.fillStyle =
        currentColor;

    ctx.font =
        `${brushSize * 5}px ${font}`;

    ctx.textBaseline =
        "top";

    ctx.fillText(
        text,
        textX,
        textY
    );

    ctx.restore();

    saveState();

    closeTextModal();

}


/* ==========================================
   NUEVO
========================================== */

function newCanvas() {

    if (
        !confirm(
            "¿Querés crear un nuevo lienzo? Se perderá el dibujo actual."
        )
    )
        return;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle =
        "white";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    history = [];

    historyIndex = -1;

    saveState();

}


/* ==========================================
   LIMPIAR
========================================== */

function clearCanvas() {

    if (
        !confirm(
            "¿Seguro que querés limpiar todo el lienzo?"
        )
    )
        return;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle =
        "white";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    saveState();

}


/* ==========================================
   GUARDAR
========================================== */

function saveImage() {

    const link =
        document.createElement("a");

    link.download =
        "mi-dibujo.png";

    link.href =
        canvas.toDataURL(
            "image/png"
        );

    link.click();

}


/* ==========================================
   ABRIR IMAGEN
========================================== */

document.getElementById("fileInput")
.addEventListener(
    "change",
    function(e) {

        const file =
            e.target.files[0];

        if (!file)
            return;

        const reader =
            new FileReader();

        reader.onload =
            function(event) {

                const img =
                    new Image();

                img.onload =
                    function() {

                        ctx.clearRect(
                            0,
                            0,
                            canvas.width,
                            canvas.height
                        );

                        ctx.fillStyle =
                            "white";

                        ctx.fillRect(
                            0,
                            0,
                            canvas.width,
                            canvas.height
                        );


                        const scale =
                            Math.min(
                                canvas.width / img.width,
                                canvas.height / img.height
                            );


                        const width =
                            img.width * scale;

                        const height =
                            img.height * scale;


                        const x =
                            (canvas.width - width) / 2;

                        const y =
                            (canvas.height - height) / 2;


                        ctx.drawImage(
                            img,
                            x,
                            y,
                            width,
                            height
                        );

                        saveState();

                    };

                img.src =
                    event.target.result;

            };

        reader.readAsDataURL(file);

        this.value = "";

    }
);


/* ==========================================
   ZOOM
========================================== */

const zoomInput =
    document.getElementById("zoom");

zoomInput.addEventListener(
    "input",
    function() {

        zoom =
            Number(this.value) / 100;

        container.style.transform =
            `translate(-50%, -50%) scale(${zoom})`;

        document.getElementById("zoomValue")
            .textContent =
            this.value;

        document.getElementById("statusZoom")
            .textContent =
            this.value;

    }
);


/* ==========================================
   TECLADO
========================================== */

document.addEventListener(
    "keydown",
    function(e) {

        /* CTRL + Z */

        if (
            e.ctrlKey &&
            e.key.toLowerCase() === "z"
        ) {

            e.preventDefault();

            undo();

        }


        /* CTRL + Y */

        if (
            e.ctrlKey &&
            e.key.toLowerCase() === "y"
        ) {

            e.preventDefault();

            redo();

        }


        /* CTRL + S */

        if (
            e.ctrlKey &&
            e.key.toLowerCase() === "s"
        ) {

            e.preventDefault();

            saveImage();

        }


        /* ESC */

        if (e.key === "Escape") {

            closeTextModal();

        }

    }
);


/* ==========================================
   ENTER EN TEXTO
========================================== */

document.getElementById("textInput")
.addEventListener(
    "keydown",
    function(e) {

        if (e.key === "Enter") {

            confirmText();

        }

    }
);


/* ==========================================
   ATAJOS DE HERRAMIENTAS
========================================== */

document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.target.tagName === "INPUT"
        )
            return;


        const shortcuts = {

            "p": "pencil",
            "b": "brush",
            "e": "eraser",
            "l": "line",
            "r": "rectangle",
            "c": "circle",
            "f": "fill",
            "t": "text",
            "i": "picker"

        };


        const selected =
            shortcuts[
                e.key.toLowerCase()
            ];


        if (!selected)
            return;


        const button =
            document.querySelector(
                `[data-tool="${selected}"]`
            );


        if (button)
            button.click();

    }
);

</script>

</body>
</html>
